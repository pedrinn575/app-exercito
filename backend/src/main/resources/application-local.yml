# Perfil local: sobe sem Supabase, usando H2 em memória.
# Uso: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local

spring:
  datasource:
    url: jdbc:h2:mem:escalas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: true
